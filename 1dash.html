<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Arptron Beta Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        :root {
            --bg-gradient: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-primary: #e0e0e0;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-primary);
            padding: 2rem;
            animation: gradient 15s ease infinite;
        }


        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transition: 0.5s;
        }

        .card:hover::before {
            left: 100%;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .beta-badge {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            margin: 0.75rem 0;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .highlight {
            color: #78e08f;
            font-weight: 500;
        }

        .star {
            background: linear-gradient(45deg, #f9d423, #ff4e50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .card {
                padding: 1rem;
            }
        }
      
.skeleton-text {
    width: 30%;
    height: 25px;
    border-radius: 5px;
    background: linear-gradient(
        90deg,
        #4B4875 25%,
        #312B60 50%,
        #4B4875 75%
    );
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite linear;
}

.skeleton-text.short {
    width: 60%;
}

@keyframes shimmer {
    0% {
        background-position: -200% 0;
    }
    100% {
        background-position: 200% 0;
    }
}

canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .container {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 800px;
            margin: 0 auto;
        }
      
      .title-container {
  display: flex;
  align-items: center;  /* Keep items aligned */
  gap: 8px;  /* Space between title and button */
}

.copy {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  position: relative; /* Needed for tooltip positioning */
}

.copy-icon {
  width: 24px;  /* Adjust icon size */
  height: 24px;
  margin-top: 9px;
  user-select: none; /* Prevent text selection */
    -webkit-user-drag: none; /* Prevent image drag in webkit browsers */
    -moz-user-select: none; /* Firefox */
    -ms-user-select: none; /* Internet Explorer */
}

/* Tooltip styling */
.tooltip {
  position: absolute;
  bottom: 150%; /* Moves it above the button */
  left: 50%;
  transform: translateX(-50%);
  background-color: black;
  color: white;
  padding: 5px 8px;
  border-radius: 5px;
  font-size: 12px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s ease-in-out;
  pointer-events: none; /* Prevents interfering with button clicks */
}

.tooltip.show {
  opacity: 1;
}
.logo {
    position: fixed;
    top: 10px;
    right: 10px;
    width: 80px; /* Adjust size if needed */
    height: auto;
    z-index: 1000; /* Ensures it stays on top */
    user-select: none; /* Prevent text selection */
    -webkit-user-drag: none; /* Prevent image drag in webkit browsers */
    -moz-user-select: none; /* Firefox */
    -ms-user-select: none; /* Internet Explorer */
}



    </style>
</head>

  <h1 id="arptronTitle">arptron_beta_0</h1>
  <button id="copy" class="copy">
    <img class="copy-icon" src="https://raw.githubusercontent.com/koo1140/random/refs/heads/main/1828249.png">
    <span id="tooltip" class="tooltip">Copied!</span>
  </button>
</div>
      <script>
       document.getElementById("copy").addEventListener("click", function () {
    const titleText = document.getElementById("arptronTitle").innerText;
    const tooltip = document.getElementById("tooltip");

    // Try to use the Clipboard API (modern browsers)
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(titleText).then(() => {
            tooltip.classList.add("show");

            // Hide tooltip after 1.5 seconds
            setTimeout(() => {
                tooltip.classList.remove("show");
            }, 1500);
        }).catch(err => {
            console.error("Failed to copy: ", err);
            fallbackCopyTextToClipboard(titleText, tooltip); // Fallback in case of failure
        });
    } else {
        // Fallback for browsers that don't support Clipboard API
        fallbackCopyTextToClipboard(titleText, tooltip);
    }
});

function fallbackCopyTextToClipboard(text, tooltip) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.select();
    textArea.setSelectionRange(0, 99999); // For mobile devices
    try {
        document.execCommand('copy'); // Fallback method for older browsers
        tooltip.classList.add("show");

        // Hide tooltip after 1.5 seconds
        setTimeout(() => {
            tooltip.classList.remove("show");
        }, 1500);
    } catch (err) {
        console.error("Fallback failed: ", err);
    }
    document.body.removeChild(textArea);
}

</script>

  <script>
        const ctx = document.getElementById('myChart').getContext('2d');
const myChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: ['Step 100', 'Step 200', 'Step 300', 'Step 400', 'Step 500'], // Labels for each step
        datasets: [{
            label: 'Training Loss Over Steps',
            data: [1.2521, 1.2161, 1.0687, 1.0859, 0.9698], // Corresponding loss values
            borderColor: '#4caf50',
            backgroundColor: 'rgba(76, 175, 80, 0.2)',
            borderWidth: 1
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false, // Ensures the graph resizes without distortion
        scales: {
            x: {
                grid: {
                    color: '#333'
                }
            },
            y: {
                grid: {
                    color: '#333'
                }
            }
        },
        plugins: {
            legend: {
                labels: {
                    color: '#fff'
                }
            }
        },
        elements: {
            line: {
                tension: 0.4
            }
        }
    }
});

    </script>
